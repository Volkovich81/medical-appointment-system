server:
  port: 8081
  servlet:
    session:
      cookie:
        same-site: lax
  tomcat:
    use-relative-redirects: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medical_db
    username: postgres
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  web:
    resources:
      static-locations: classpath:/META-INF/resources/
      cache:
        period: 0
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

logging:
  level:
    root: INFO
    com.medical.system: DEBUG
  file:
    name: ./logs/medical-system.log